plugins {
    id 'maven-publish'
}

allprojects {
    group = 'eu.magicmine'
    version = correctVersion('2.0.0')
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    compileJava.options.encoding = 'UTF-8'
    sourceCompatibility = '1.17'
    targetCompatibility = '1.17'

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.26'
        annotationProcessor 'org.projectlombok:lombok:1.18.26'
    }

    repositories {
        mavenCentral()
    }
}


subprojects {
    apply plugin: 'java'
    configurations {
        customConfig.extendsFrom implementation
    }
	repositories {
		mavenCentral()
        maven {
            name = "papermc"
            url = uri("https://repo.papermc.io/repository/maven-public/")
        }
    }
}

tasks.register('createFatJar',Jar) {

    dependsOn tasks.named('build')

    doFirst {
        archiveBaseName = "Pivot"


        subprojects.each { subproject ->
            File file = new File(subproject.getBuildDir().getPath() + "/libs/")
            boolean shadowed = file.listFiles().any {
                it.getName().contains("-all")
            }
            from file.listFiles().collect {

                if (shadowed && !it.getName().contains("-all")) {
                    return;
                }

                if (it.getName().endsWith(".jar")) {
                    zipTree(it)
                } else {
                    fileTree(it)
                }

            }
        }
    }

}



publishing {
    publications {
        maven(MavenPublication) {

            groupId = 'it.goodtimes14'
            artifact createFatJar
            version = correctVersion()


        }
    }

    repositories {
        maven {
            url = uri(correctPublishUrl(NEXUS_URL))
            credentials {
                username = NEXUS_REPO_USERNAME
                password = NEXUS_REPO_PASSWORD
            }
        }
    }
}


tasks.named('build') {
    dependsOn subprojects*.build
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar) {
    eachFile {
        it.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


def getGitBranch() {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

def getGitHash() {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

def isSnapshot() {
    def currentBranch = getGitBranch()
    return currentBranch != null && currentBranch != '2.0-REBORN'
}

def correctVersion(String rootVersion = null) {
    String suffix = isSnapshot() ? '-SNAPSHOT' : ''
    String currentVersion = rootVersion == null ? rootProject.version : rootVersion;

    println("snapshot: " + isSnapshot())
    return currentVersion.endsWith(suffix) ? currentVersion : currentVersion + suffix
}

def correctPublishUrl(String baseUrl) {
    return baseUrl + (isSnapshot() ? 'maven-snapshots' : 'maven-releases') + '/'
}